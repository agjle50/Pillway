# =============================================================================
#  YOUR PERSONAL SETTINGS (example)
# =============================================================================
#  1. Copy this file and name the copy:   pillway_config.local.toml
#     (just remove ".example" from the name)
#  2. Paste your DeepSeek API key between the quotes below.
#     Get one at https://platform.deepseek.com/api_keys (it starts with "sk-").
#     Or simply use the app: Settings > AI connection.
#  3. Save and run:  python Pillway.py --check-config
#
#  pillway_config.local.toml is listed in .gitignore, so it is never committed.
#  Anything you set here overrides pillway_config.toml, just for you.
# =============================================================================

[ai]
api_key = ""

# Optional: the cheapest model for everything while you develop (uncomment by removing the #).
# care_plan_model = "deepseek-flash"

# Optional: use Google Gemini instead (then paste a Gemini key above, starting with "AIza").
# provider = "gemini"

# Optional: always use the offline demo on your laptop.
# demo_mode = true
